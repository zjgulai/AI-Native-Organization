name: Deploy solution site to Pages

on:
  push:
    branches:
      - main
    paths:
      - "dist/**"
      - "bp/index.html"
      - "docs/12-rollout/IMPLEMENTATION-BLUEPRINT.html"
      - "scripts/build-pages-docs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static bundle
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app.js
          test -f dist/data/roles.json
          test -f dist/data/flows.json
          test -f dist/data/e2e-workflows.json
          test -f dist/bp/index.html
          test -f dist/docs/12-rollout/IMPLEMENTATION-BLUEPRINT.html

      # Pages 只发布 dist/，因此「源文档改了、dist 副本没重建」会让公网长期展示旧内容
      # 而不报任何错。这里重跑一次生成脚本再比对：副本过期即失败，而不是静默上线。
      - name: Verify docs bundle matches its sources
        run: |
          node scripts/build-pages-docs.mjs
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ 与源文档不一致：请在本地运行 node scripts/build-pages-docs.mjs 并提交结果"
            git --no-pager diff --stat -- dist/
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
